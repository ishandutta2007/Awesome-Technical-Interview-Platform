<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#3b82f6;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#3b82f6;#6366f1;#8b5cf6" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#8b5cf6;#ec4899;#38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Cyan/Teal Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #a5b4fc;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(25px, -20px); }
    }
    .orb-1 {
      animation: floatOrb 8s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-2 {
      animation: floatOrb 10s ease-in-out infinite reverse;
      transform-origin: center;
    }
    .scan-line {
      animation: scan 4s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Background -->
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Orbs in Background -->
  <g class="orb-1">
    <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="1050" cy="280" r="160" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  </g>
  <circle cx="600" cy="180" r="180" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Decorative Window Frame on the Right -->
  <g transform="translate(730, 45)">
    <!-- Terminal Background -->
    <rect width="420" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect width="420" height="36" rx="12" fill="#1e293b" />
    <rect y="24" width="420" height="12" fill="#1e293b" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="6" fill="#ef4444" />
    <circle cx="40" cy="18" r="6" fill="#f59e0b" />
    <circle cx="60" cy="18" r="6" fill="#10b981" />
    <text x="210" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">interview_session.py • Live Sandbox</text>

    <!-- Code Snippet Simulation -->
    <g transform="translate(24, 60)">
      <text y="15" class="code-text"><tspan fill="#ec4899">def</tspan> <tspan fill="#38bdf8">evaluate_candidate</tspan>(solution):</text>
      <text y="40" class="code-text">    sandbox = <tspan fill="#f59e0b">CodeEngine</tspan>(<tspan fill="#10b981">"Judge0"</tspan>)</text>
      <text y="65" class="code-text">    result = sandbox.<tspan fill="#38bdf8">execute</tspan>(solution)</text>
      <text y="90" class="code-text">    <tspan fill="#ec4899">return</tspan> {</text>
      <text y="115" class="code-text">        <tspan fill="#10b981">"status"</tspan>: <tspan fill="#10b981">"ACCEPTED"</tspan>,  <tspan fill="#64748b"># ✓ 42/42 tests</tspan></text>
      <text y="140" class="code-text">        <tspan fill="#10b981">"latency"</tspan>: <tspan fill="#38bdf8">"18ms"</tspan>,      <tspan fill="#64748b"># Memory: 12MB</tspan></text>
      <text y="165" class="code-text">        <tspan fill="#10b981">"score"</tspan>: <tspan fill="#f59e0b">100</tspan></text>
      <text y="190" class="code-text">    }</text>
    </g>

    <!-- Live Execution Pulse Indicator -->
    <g transform="translate(365, 235)">
      <circle cx="0" cy="0" r="5" fill="#10b981">
        <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-12" y="4" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#10b981" font-weight="600">LIVE</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 65)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="tag">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Dynamic Gradient -->
    <text x="0" y="80" class="title" fill="url(#primaryGrad)" filter="url(#softGlow)">
      Awesome Technical
    </text>
    <text x="0" y="130" class="title" fill="#ffffff">
      Interview Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">
      The ultimate guide to SaaS platforms &amp; open-source coding assessment
    </text>
    <text x="0" y="195" class="subtitle">
      engines, online judges, sandboxes, and candidate evaluation tools.
    </text>

    <!-- Badges / Pillars at Bottom -->
    <g transform="translate(0, 225)">
      <!-- Pill 1: SaaS Leaders -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">⚡ SaaS Leaders</text>

      <!-- Pill 2: Open Source Judges -->
      <rect x="145" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="222" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🔓 Open-Source Judges</text>

      <!-- Pill 3: Sandboxes -->
      <rect x="310" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="382" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🛡️ Code Sandboxes</text>

      <!-- Pill 4: Transparent Pricing -->
      <rect x="465" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="542" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">📊 Transparent Pricing</text>
    </g>
  </g>
</svg>
